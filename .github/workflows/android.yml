name: Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Coin-0.0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coin-0.0.1-debug
          path: Coin-0.0.1-debug.apk
          if-no-files-found: error

      - name: Publish Coin 0.0.1 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.1 >/dev/null 2>&1; then
            gh release upload v0.0.1 Coin-0.0.1-debug.apk --clobber
          else
            gh release create v0.0.1 Coin-0.0.1-debug.apk \
              --title "Coin 0.0.1" \
              --notes "Coin 0.0.1 early preview: live crypto prices, watchlist, chart detail, Liquid Glass-inspired navigation and interaction animations." \
              --target "$GITHUB_SHA"
          fi
