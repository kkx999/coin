name: Android

on:
  push:
    branches: [ "main", "v0.0.2-dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 币行情-0.0.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 币行情-0.0.2-debug
          path: 币行情-0.0.2-debug.apk
          if-no-files-found: error

      - name: Publish 0.0.2 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.2 >/dev/null 2>&1; then
            gh release upload v0.0.2 币行情-0.0.2-debug.apk --clobber
          else
            gh release create v0.0.2 币行情-0.0.2-debug.apk \
              --title "币行情 0.0.2" \
              --notes "全新中文界面、交易所风格 K 线、实时逐笔成交监控、系统返回键修复与交互美化。" \
              --target "$GITHUB_SHA"
          fi
